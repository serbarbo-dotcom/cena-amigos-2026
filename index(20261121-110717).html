<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cena de Amigos 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:16px system-ui}main{max-width:800px;margin:auto;padding:16px}h1,h2{margin:12px 0}header{text-align:center;padding:20px}section{background:#1e293b;border-radius:16px;padding:16px;margin:14px 0}button,input,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #64748b}button{background:#334155;color:white;cursor:pointer}input,select{background:#0f172a;color:white;width:100%;margin:5px 0}button:disabled{opacity:.45}button.on{background:#166534} .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.grid button{padding:8px 0;min-height:55px}.grid small{display:block} .muted{color:#cbd5e1} .gold{color:#fbbf24} .row{display:flex;gap:8px;flex-wrap:wrap} [hidden]{display:none!important} #msg{white-space:pre-wrap;color:#fbbf24} p{overflow-wrap:anywhere}
</style><main><header><h1>🍽️ Cena de Amigos 2026</h1><div class="muted">Diez amigos, una fecha</div></header><p id="msg" role="status"></p><section id="login"><h2>Entrar</h2><form id="loginForm"><label>Tu nombre<select id="nombre"></select></label><label>Tu PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button>Entrar</button></form></section><div id="app" hidden><section><div class="row"><strong id="saludo"></strong><button id="refresh">Actualizar</button><button id="logout">Salir</button></div><h2 class="gold">Fecha oficial</h2><div id="oficial"></div></section><section><h2>📅 Disponibilidad</h2><p class="muted">Pulsa los días que puedes asistir. Verde = puedes. El número indica cuántos amigos pueden.</p><div id="cal"></div><p id="detalle"></p><h3>Mejores fechas</h3><div id="ranking"></div></section><section><h2>🍴 Restaurantes</h2><form id="proponer"><input type="date" id="pd" required><input id="pr" maxlength="200" placeholder="Restaurante y detalles" required><button>Proponer</button></form><div id="propuestas"></div></section><section><h2>🎁 Amigo invisible</h2><p id="votos"></p><div class="row"><button id="si">Sí</button><button id="no">No</button></div><p id="resultado"></p><button id="regalo">Ver mi destinatario</button><p id="destino"></p></section><section id="admin" hidden><h2>👑 Administración</h2><form id="fijar"><input type="date" id="fd" required><input id="fl" maxlength="250" placeholder="Restaurante y hora" required><button>Confirmar cena</button></form><p><button id="sortear">Realizar sorteo</button></p><h3>Restablecer PIN</h3><form id="reset"><select id="rn"></select><input id="rp" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Nuevo PIN" required><button>Cambiar PIN</button></form></section></div></main><script>
const URLBASE='https://fpslpkkjyuvcojwhzrak.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwc2xwa2tqeXV2Y29qd2h6cmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNjk5MTcsImV4cCI6MjExMDc0NTkxN30.xIX1rh5CwVaLMOAaH6FTrHFfAhbHD_JsuqzORMWfQfU';
const names=['Nacho','Juan','Manolo','Pablo','Bufi','Niño','Tijuana','Mejicano','Agustín','Kike'], $=id=>document.getElementById(id);let session=null, days=[], busy=false;try{session=JSON.parse(sessionStorage.getItem('cena'))}catch{};for(const id of ['nombre','rn'])for(const n of names)$(id).add(new Option(n,n));const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid'}).format(new Date());for(const id of ['pd','fd']){$(id).min='2026-11-20';$(id).max='2026-12-31'}
async function rpc(n,p={}){const r=await fetch(URLBASE+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(p)});const v=await r.json();if(!r.ok)throw Error(v.message||'Error de conexión');return v}const call=(n,p={})=>rpc(n,{p_token:session.token,...p});function show(){ $('login').hidden=!!session;$('app').hidden=!session;$('admin').hidden=!session?.admin;$('saludo').textContent=session?'Hola, '+session.nombre:''}function clear(){session=null;sessionStorage.removeItem('cena');$('destino').textContent='';show()}async function act(fn){if(busy)return;busy=true;$('msg').textContent='';try{await fn()}catch(e){$('msg').textContent=e.message;if(/Sesion no valida/i.test(e.message))clear()}finally{busy=false}}function text(parent,s){let p=document.createElement('p');p.textContent=s;parent.append(p)}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}
function renderCal(){const root=$('cal');root.replaceChildren();const count=d=>days.filter(x=>x.dia===d);let ranked=[];for(const m of [11,12]){let h=document.createElement('h3');h.textContent=m===11?'Noviembre':'Diciembre';root.append(h);let g=document.createElement('div');g.className='grid';root.append(g);for(const w of ['L','M','X','J','V','S','D']){let s=document.createElement('span');s.textContent=w;g.append(s)}for(let i=0;i<(new Date(2026,m-1,1).getDay()+6)%7;i++)g.append(document.createElement('span'));for(let i=1;i<=new Date(2026,m,0).getDate();i++){let d=`2026-${m}-${String(i).padStart(2,'0')}`,a=count(d),mine=a.some(x=>x.nombre===session.nombre),b=document.createElement('button');b.textContent=i;let s=document.createElement('small');s.textContent=a.length+'/10';b.append(s);b.className=mine?'on':'';b.disabled=d<'2026-11-20'||d<today();b.setAttribute('aria-pressed',mine);b.onclick=()=>act(async()=>{await call('marcar_dia',{p_dia:d,p_disponible:!mine});days=await call('consultar_calendario');renderCal();$('detalle').textContent=fmt(d)+': '+(count(d).map(x=>x.nombre).join(', ')||'Nadie disponible')});g.append(b);if(!b.disabled&&a.length)ranked.push({d,a})}}$('ranking').replaceChildren();ranked.sort((a,b)=>b.a.length-a.a.length||a.d.localeCompare(b.d));for(const x of ranked.slice(0,10))text($('ranking'),fmt(x.d)+' · '+x.a.length+'/10 · '+x.a.map(y=>y.nombre).join(', '));if(!ranked.length)text($('ranking'),'Todavía no hay coincidencias.');}
async function refresh(){let [c,v,z]=await Promise.all([call('consultar_calendario'),call('consultar_votacion'),call('consultar_cena')]);days=c;renderCal();$('oficial').textContent=z.fecha_oficial?fmt(z.fecha_oficial.dia)+' · '+z.fecha_oficial.lugar:'Todavía sin confirmar';$('propuestas').replaceChildren();for(const p of z.propuestas)text($('propuestas'),fmt(p.dia)+' · '+p.restaurante+' — '+p.nombre);$('votos').textContent=v.total+'/10 han votado. Tu voto: '+(v.mi_voto===null?'Pendiente':v.mi_voto?'Sí':'No');$('si').disabled=$('no').disabled=v.finalizada;$('si').className=v.mi_voto===true?'on':'';$('no').className=v.mi_voto===false?'on':'';$('resultado').textContent=v.finalizada?'Sí: '+v.si+' · No: '+v.no+(v.si>5?' · Aprobado':' · No aprobado'):'Resultados ocultos hasta finalizar';$('sortear').disabled=!(v.finalizada&&v.si>5)}
$('loginForm').onsubmit=e=>{e.preventDefault();act(async()=>{let v=await rpc('iniciar_sesion_pin',{p_nombre:$('nombre').value,p_pin:$('pin').value});$('pin').value='';if(!v.ok)throw Error(v.mensaje||'Acceso incorrecto');session=v;sessionStorage.setItem('cena',JSON.stringify(v));show();await refresh()})};$('refresh').onclick=()=>act(refresh);$('logout').onclick=()=>act(async()=>{await call('cerrar_sesion');clear()});for(const [id,v] of [['si',true],['no',false]])$(id).onclick=()=>act(async()=>{await call('votar_invisible',{p_voto:v});await refresh()});$('proponer').onsubmit=e=>{e.preventDefault();act(async()=>{await call('proponer_restaurante',{p_dia:$('pd').value,p_restaurante:$('pr').value});$('pr').value='';await refresh()})};$('fijar').onsubmit=e=>{e.preventDefault();act(async()=>{await call('fijar_fecha_oficial',{p_dia:$('fd').value,p_lugar:$('fl').value});await refresh()})};$('sortear').onclick=()=>{if(confirm('¿Realizar el sorteo definitivo?'))act(async()=>{await call('realizar_sorteo');$('msg').textContent='Sorteo realizado'})};$('regalo').onclick=()=>act(async()=>{if($('destino').textContent){$('destino').textContent='';return}let d=await call('consultar_regalo');$('destino').textContent=d?'Te toca regalar a: '+d:'Sorteo pendiente'});$('reset').onsubmit=e=>{e.preventDefault();act(async()=>{await call('restablecer_pin',{p_nombre:$('rn').value,p_nuevo_pin:$('rp').value});$('rp').value='';$('msg').textContent='PIN cambiado';if($('rn').value===session.nombre)clear()})};show();if(session)act(refresh);
</script></html>
