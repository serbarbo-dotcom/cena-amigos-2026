<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#352416"><title>Los Vagos · Nuestra cantina</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet"><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>

.item h3{margin:0 0 8px}.gold{color:#f3ca7f}.danger{background:#9d3029}.success{background:#39633a}.notice{border-left:4px solid #e3b567;padding:9px 12px;background:#362417;margin:12px 0}.message{padding:10px 12px;background:#6a4221;border-radius:8px;white-space:pre-wrap}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week>span{text-align:center;color:#e5cb9f;font-size:12px}.week button{min-width:0;padding:9px 1px}.week small{display:block;font-size:10px}.marked{background:#35653a}.full{outline:2px solid #e4c16f}.pill{display:inline-block;background:#87603a;border-radius:99px;padding:4px 9px;font-size:12px}.photo{width:100%;max-height:320px;object-fit:contain;background:#1e130d;border-radius:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.link{color:#f4d293;word-break:break-all}.subtle{font-size:13px;color:#d7bd98}.line{border:0;border-top:1px solid #9a7146;margin:22px 0}[v-cloak]{display:none}@media(max-width:520px){.tiles{gap:9px}.tile{min-height:135px}.two{grid-template-columns:1fr}main{padding:9px}.week{gap:2px}.week button{font-size:13px}section{padding:13px}}
</style></head><body><div id="app" v-cloak><main><header><small>★ BIENVENIDOS A LA CANTINA DE ★</small><h1 class="western">LOS VAGOS</h1><div class="star">✦ AMIGOS PARA TODA LA VIDA ✦</div></header><p v-if="mensaje" class="message" role="status">{{mensaje}}</p>
<section v-if="!sesion"><h2>🔐 Entrada a la cantina</h2><form @submit.prevent="entrar"><label>¿Quién eres?<select v-model="nombre"><option v-for="n in nombres" :key="n">{{n}}</option></select></label><label>Tu PIN<input v-model="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></label><button :disabled="ocupado">Entrar</button></form></section>
<template v-else><div class="row" style="margin-top:12px"><strong>🤠 {{sesion.nombre}}</strong><span v-if="sesion.admin" class="pill">Administrador</span><button @click="actualizar" :disabled="ocupado">Actualizar</button><button @click="salir" :disabled="ocupado">Salir</button></div>
<template v-if="vista==='inicio'"><section><h2>¿Qué hacemos hoy?</h2><div class="tiles"><button class="tile" @click="vista='quedadas'"><span>🍻</span><strong>Quedadas</strong><small>Propón cualquier plan</small></button><button class="tile" @click="vista='fotos'"><span>📸</span><strong>Fotos de los Vagos</strong><small>Nuestros recuerdos</small></button><button class="tile" @click="vista='fechas'"><span>📅</span><strong>Fechas importantes</strong><small>Cumpleaños y celebraciones</small></button><button class="tile" @click="vista='musica'"><span>🎵</span><strong>Música de los Vagos</strong><small>Nuestra gramola</small></button></div></section></template>
<template v-else><button class="back" @click="vista='inicio';seleccion=null">← Volver a la portada</button>
<section v-if="vista==='quedadas'"><h2>🍻 Quedadas</h2><p class="muted">Cualquier Vago puede proponer una cena, viaje, cumpleaños, marcha o lo que se le ocurra.</p><div class="item"><h3>🎄 Cena de Navidad 2026</h3><p>La quedada original, con su calendario, restaurantes, votación y amigo invisible.</p><button @click="vista='navidad'">Entrar en la cena de Navidad</button></div><h3>➕ Proponer una quedada</h3><form @submit.prevent="crearQuedada"><label>¿Qué plan propones?<input v-model="nuevaQuedada.titulo" maxlength="100" minlength="3" placeholder="Ej.: Escapada a Asturias" required></label><label>Cuéntanos el plan<textarea v-model="nuevaQuedada.descripcion" maxlength="1000" placeholder="¿Qué os apetece hacer?"></textarea></label><label>Fecha orientativa (opcional)<input type="date" v-model="nuevaQuedada.fecha"></label><button :disabled="ocupado">Publicar quedada</button></form><h3>Planes propuestos</h3><p v-if="!datos.quedadas.length" class="muted">Todavía no hay propuestas. ¡Sé el primero!</p><div v-for="q in datos.quedadas" :key="q.id" class="item"><h3>{{q.titulo}}</h3><p>{{q.descripcion}}</p><p class="subtle">Propuesto por {{q.creador}} <span v-if="q.fecha_sugerida">· {{formato(q.fecha_sugerida)}}</span></p><p v-if="q.fecha_oficial" class="gold">📍 Confirmado: {{formato(q.fecha_oficial)}} · {{q.lugar}}</p><div class="row"><button @click="seleccion=seleccion===q.id?null:q.id">{{seleccion===q.id?'Cerrar':'Ver y marcar fechas'}}</button><button v-if="sesion.admin||sesion.nombre===q.creador" class="danger" @click="borrar('borrar_quedada',q)">Eliminar</button></div><div v-if="seleccion===q.id"><hr class="line"><h3>Disponibilidad</h3><label>Elige un día<input type="date" v-model="diaElegido[q.id]"></label><button :disabled="ocupado||!diaElegido[q.id]" @click="marcarQuedada(q)">{{marcado(q.id,diaElegido[q.id])?'Quitar mi disponibilidad':'Puedo ir ese día'}}</button><div v-for="d in resumenDias(q.id)" :key="d.dia" class="notice"><strong>{{formato(d.dia)}} · {{d.amigos.length}}/10</strong><p>{{d.amigos.join(', ')}}</p></div><template v-if="sesion.admin"><h3>Confirmar fecha y lugar</h3><label>Fecha<input type="date" v-model="oficiales[q.id].fecha"></label><label>Lugar y hora<input v-model="oficiales[q.id].lugar" maxlength="250" placeholder="Restaurante, hora, etc."></label><button :disabled="ocupado" @click="fijarQuedada(q)">Guardar fecha oficial</button></template></div></div></section>
<section v-if="vista==='fotos'"><h2>📸 Fotos de los Vagos</h2><p class="muted">Añadid enlaces HTTPS de fotos que ya estén publicadas o alojadas en un servicio de imágenes. Esta versión no sube archivos directamente.</p><form @submit.prevent="crearElemento('foto')"><label>Título de la foto<input v-model="nuevaFoto.titulo" maxlength="120" required></label><label>Enlace directo de la imagen<input v-model="nuevaFoto.url" type="url" placeholder="https://..." required></label><button :disabled="ocupado">Añadir foto</button></form><div v-for="f in datos.fotos" :key="f.id" class="item"><h3>{{f.titulo}}</h3><a :href="urlSegura(f.url)||'#'" target="_blank" rel="noopener noreferrer" class="link" v-if="urlSegura(f.url)"><img v-if="esImagen(f.url)" class="photo" :src="urlSegura(f.url)" :alt="f.titulo" loading="lazy">Abrir foto</a><p class="subtle">Añadida por {{f.creador}}</p><button v-if="sesion.admin||sesion.nombre===f.creador" class="danger" @click="borrar('borrar_foto',f)">Eliminar</button></div><p v-if="!datos.fotos.length" class="muted">Todavía no hay fotos.</p></section>
<section v-if="vista==='fechas'"><h2>📅 Fechas importantes</h2><p class="muted">Cumpleaños, aniversarios y celebraciones. Sin alarmas ni notificaciones.</p><form @submit.prevent="crearElemento('fecha')"><label>Acontecimiento<input v-model="nuevaFecha.titulo" maxlength="120" minlength="3" required></label><label>Fecha<input v-model="nuevaFecha.fecha" type="date" required></label><label>Detalles (opcional)<textarea v-model="nuevaFecha.detalle" maxlength="500"></textarea></label><label><input type="checkbox" v-model="nuevaFecha.anual" style="width:auto"> Repetir cada año (cumpleaños)</label><button :disabled="ocupado">Guardar fecha</button></form><div v-for="f in datos.fechas" :key="f.id" class="item"><h3>{{f.titulo}}</h3><strong class="gold">{{formato(f.dia)}}</strong><span v-if="f.anual" class="pill">Cada año</span><p>{{f.detalle}}</p><p class="subtle">Añadido por {{f.creador}}</p><button v-if="sesion.admin||sesion.nombre===f.creador" class="danger" @click="borrar('borrar_fecha',f)">Eliminar</button></div><p v-if="!datos.fechas.length" class="muted">Todavía no hay fechas importantes.</p></section>
<section v-if="vista==='musica'"><h2>🎵 Música de los Vagos</h2><p class="muted">Guardad enlaces a canciones de YouTube o Spotify. Al pulsar se abrirán en su plataforma.</p><form @submit.prevent="crearElemento('musica')"><label>Canción<input v-model="nuevaMusica.titulo" maxlength="120" required></label><label>Artista<input v-model="nuevaMusica.artista" maxlength="120"></label><label>Enlace de YouTube o Spotify<input v-model="nuevaMusica.url" type="url" placeholder="https://..." required></label><button :disabled="ocupado">Añadir canción</button></form><div v-for="m in datos.musica" :key="m.id" class="item"><h3>🎶 {{m.titulo}}</h3><p>{{m.artista}}</p><a v-if="urlSegura(m.url)" class="link" :href="urlSegura(m.url)" target="_blank" rel="noopener noreferrer">▶ Escuchar canción</a><p class="subtle">Recomendada por {{m.creador}}</p><button v-if="sesion.admin||sesion.nombre===m.creador" class="danger" @click="borrar('borrar_musica',m)">Eliminar</button></div><p v-if="!datos.musica.length" class="muted">La gramola está vacía. ¡Añade la primera canción!</p></section>
<section v-if="vista==='navidad'"><h2>🎄 Cena de Navidad 2026</h2><div class="notice"><h3>Fecha oficial</h3><p v-if="antigua.fecha_oficial">{{formato(antigua.fecha_oficial.dia)}} · {{antigua.fecha_oficial.lugar}}</p><p v-else>Sin confirmar</p></div><h3>📅 Calendario</h3><p class="muted">Verde: tú puedes ir. El número indica cuántos amigos han marcado ese día.</p><div v-for="mes in meses" :key="mes.m"><h3>{{mes.nombre}}</h3><div class="week"><span v-for="w in semana" :key="w">{{w}}</span><span v-for="i in mes.huecos" :key="i"></span><button v-for="d in mes.dias" :key="d" :disabled="ocupado||d<'2026-11-20'||d<hoy" :class="{'marked':misDias(d),'full':amigosDia(d).length===10}" @click="marcarNavidad(d)">{{Number(d.slice(-2))}}<small>{{amigosDia(d).length}}/10</small></button></div></div><h3>🏆 Fechas con más amigos</h3><div v-for="d in rankingNavidad" :key="d.dia" class="item">{{formato(d.dia)}} · {{d.amigos.length}}/10<p class="subtle">{{d.amigos.join(', ')}}</p></div><h3>🍴 Proponer restaurante</h3><form @submit.prevent="proponerNavidad"><label>Fecha<input type="date" v-model="navPropuesta.fecha" min="2026-11-20" max="2026-12-31" required></label><label>Restaurante<input v-model="navPropuesta.restaurante" maxlength="200" required></label><button :disabled="ocupado">Proponer</button></form><div v-for="(p,i) in antigua.propuestas" :key="i" class="item">{{formato(p.dia)}} · {{p.restaurante}} <small>— {{p.nombre}}</small></div><h3>🎁 Amigo invisible</h3><p>Han votado {{votos.total||0}}/10 · Tu voto: {{votos.mi_voto===null||votos.mi_voto===undefined?'Pendiente':votos.mi_voto?'Sí':'No'}}</p><div class="row"><button :disabled="ocupado||votos.finalizada" @click="votar(true)">👍 Sí</button><button :disabled="ocupado||votos.finalizada" @click="votar(false)">👎 No</button></div><p>{{votos.finalizada?'Sí: '+votos.si+' · No: '+votos.no:'Resultados ocultos hasta finalizar'}}</p><button @click="verRegalo" :disabled="ocupado">{{destinatario?'Ocultar destinatario':'Ver mi destinatario'}}</button><p class="gold" v-if="destinatario">Te toca regalar a: {{destinatario}}</p><p v-if="regaloPendiente">Sorteo pendiente</p><template v-if="sesion.admin"><hr class="line"><h3>👑 Administración de la cena</h3><form @submit.prevent="fijarNavidad"><label>Fecha oficial<input v-model="navOficial.fecha" type="date" min="2026-11-20" max="2026-12-31" required></label><label>Restaurante y hora<input v-model="navOficial.lugar" maxlength="250" required></label><button :disabled="ocupado">Confirmar cena</button></form><p><button :disabled="ocupado||!votos.finalizada||votos.si<=5" @click="sortear">Realizar sorteo</button></p><h3>Restablecer PIN</h3><form @submit.prevent="cambiarPin"><select v-model="reset.nombre"><option v-for="n in nombres" :key="n">{{n}}</option></select><input v-model="reset.pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Nuevo PIN" required><button :disabled="ocupado">Cambiar PIN</button></form><h3>🗑️ Gestión de datos de la cena</h3><div class="two"><button @click="limpiar('propuestas')" :disabled="ocupado">Borrar restaurantes</button><button @click="limpiar('fecha')" :disabled="ocupado">Anular fecha oficial</button><button @click="limpiar('votos')" :disabled="ocupado">Reiniciar votos y sorteo</button><button @click="limpiar('calendario')" :disabled="ocupado">Limpiar calendario</button></div><p><button class="danger" @click="limpiar('todo')" :disabled="ocupado">Borrar TODOS los datos de la cena</button></p></template></section>
</template></template><footer class="subtle" style="text-align:center;margin:24px">★ LOS VAGOS · Nuestra cantina particular ★</footer></main></div>
<script>

const empty=()=>({quedadas:[],dias:[],fechas:[],fotos:[],musica:[]});
createApp({data(){let sesion=null;try{sesion=JSON.parse(sessionStorage.getItem('cena'))}catch{}return {nombres:['Nacho','Juan','Manolo','Pablo','Bufi','Niño','Tijuana','Mejicano','Agustín','Kike'],semana:['L','M','X','J','V','S','D'],sesion,nombre:'Nacho',pin:'',vista:'inicio',ocupado:false,mensaje:'',datos:empty(),seleccion:null,diaElegido:{},oficiales:{},nuevaQuedada:{titulo:'',descripcion:'',fecha:''},nuevaFecha:{titulo:'',fecha:'',detalle:'',anual:false},nuevaFoto:{titulo:'',url:''},nuevaMusica:{titulo:'',artista:'',url:''},antigua:{fecha_oficial:null,propuestas:[]},calendario:[],votos:{total:0,mi_voto:null,finalizada:false,si:0,no:0},navPropuesta:{fecha:'',restaurante:''},navOficial:{fecha:'',lugar:''},reset:{nombre:'Nacho',pin:''},destinatario:'',regaloPendiente:false}},computed:{hoy(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid'}).format(new Date())},meses(){return [11,12].map(m=>{const dias=[];for(let i=1;i<=new Date(2026,m,0).getDate();i++)dias.push(`2026-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`);return {m,nombre:m===11?'Noviembre 2026':'Diciembre 2026',huecos:(new Date(2026,m-1,1).getDay()+6)%7,dias}})},rankingNavidad(){const grupos={};for(const d of this.calendario){(grupos[d.dia]??=[]).push(d.nombre)}return Object.entries(grupos).filter(([d])=>d>=this.hoy).map(([dia,amigos])=>({dia,amigos})).sort((a,b)=>b.amigos.length-a.amigos.length||a.dia.localeCompare(b.dia)).slice(0,10)}},methods:{async rpc(n,p={}){const r=await fetch(URLBASE+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(p)});const raw=await r.text();let v;try{v=raw?JSON.parse(raw):null}catch{throw Error('Respuesta inesperada del servidor')}if(!r.ok)throw Error(v?.message||'Error de conexión');return v},call(n,p={}){if(!this.sesion?.token)throw Error('Sesion no valida');return this.rpc(n,{p_token:this.sesion.token,...p})},async ejecutar(fn){if(this.ocupado)return;this.ocupado=true;this.mensaje='';try{await fn()}catch(e){this.mensaje=e.message||'Ha ocurrido un error';if(/Sesion no valida|Sesión no válida/i.test(this.mensaje))this.limpiarSesion()}finally{this.ocupado=false}},limpiarSesion(){this.sesion=null;sessionStorage.removeItem('cena');this.vista='inicio';this.destinatario=''},async entrar(){await this.ejecutar(async()=>{const v=await this.rpc('iniciar_sesion_pin',{p_nombre:this.nombre,p_pin:this.pin});this.pin='';if(!v.ok)throw Error(v.mensaje||'Acceso incorrecto');this.sesion=v;sessionStorage.setItem('cena',JSON.stringify(v));await this.cargar()})},async salir(){await this.ejecutar(async()=>{await this.call('cerrar_sesion');this.limpiarSesion()})},async cargar(){const [d,c,v,z]=await Promise.all([this.call('vagos_datos'),this.call('consultar_calendario'),this.call('consultar_votacion'),this.call('consultar_cena')]);this.datos=d||empty();this.calendario=c||[];this.votos=v||{};this.antigua=z||{fecha_oficial:null,propuestas:[]};for(const q of this.datos.quedadas){if(!this.oficiales[q.id])this.oficiales[q.id]={fecha:q.fecha_oficial||'',lugar:q.lugar||''}}},async actualizar(){await this.ejecutar(async()=>{await this.cargar();this.mensaje='Datos actualizados'})},formato(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})},urlSegura(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch{return null}},esImagen(u){return /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(u)},async accion(a,d){await this.ejecutar(async()=>{await this.call('vagos_accion',{p_accion:a,p_datos:d});await this.cargar();this.mensaje='Guardado correctamente'})},async crearQuedada(){await this.accion('crear_quedada',this.nuevaQuedada);if(this.mensaje==='Guardado correctamente')this.nuevaQuedada={titulo:'',descripcion:'',fecha:''}},async crearElemento(tipo){const cfg={foto:['crear_foto','nuevaFoto',{titulo:'',url:''}],fecha:['crear_fecha','nuevaFecha',{titulo:'',fecha:'',detalle:'',anual:false}],musica:['crear_musica','nuevaMusica',{titulo:'',artista:'',url:''}]}[tipo];if(!cfg)return;await this.accion(cfg[0],this[cfg[1]]);if(this.mensaje==='Guardado correctamente')this[cfg[1]]=cfg[2]},async borrar(a,item){if(!confirm('¿Eliminar «'+item.titulo+'»? No se puede deshacer.'))return;await this.accion(a,{id:item.id})},marcado(id,d){return !!d&&this.datos.dias.some(x=>x.quedada_id===id&&x.dia===d&&x.nombre===this.sesion.nombre)},resumenDias(id){const m={};for(const d of this.datos.dias.filter(x=>x.quedada_id===id)){(m[d.dia]??=[]).push(d.nombre)}return Object.entries(m).map(([dia,amigos])=>({dia,amigos})).sort((a,b)=>b.amigos.length-a.amigos.length||a.dia.localeCompare(b.dia))},async marcarQuedada(q){const fecha=this.diaElegido[q.id];await this.accion('marcar_dia',{id:q.id,fecha,disponible:!this.marcado(q.id,fecha)})},async fijarQuedada(q){await this.accion('fijar_quedada',{id:q.id,...this.oficiales[q.id]})},amigosDia(d){return this.calendario.filter(x=>x.dia===d).map(x=>x.nombre)},misDias(d){return this.calendario.some(x=>x.dia===d&&x.nombre===this.sesion.nombre)},async marcarNavidad(d){await this.ejecutar(async()=>{await this.call('marcar_dia',{p_dia:d,p_disponible:!this.misDias(d)});await this.cargar()})},async proponerNavidad(){await this.ejecutar(async()=>{await this.call('proponer_restaurante',{p_dia:this.navPropuesta.fecha,p_restaurante:this.navPropuesta.restaurante});this.navPropuesta.restaurante='';await this.cargar()})},async votar(v){await this.ejecutar(async()=>{await this.call('votar_invisible',{p_voto:v});await this.cargar()})},async verRegalo(){if(this.destinatario){this.destinatario='';return}await this.ejecutar(async()=>{const d=await this.call('consultar_regalo');this.destinatario=d||'';this.regaloPendiente=!d})},async fijarNavidad(){await this.ejecutar(async()=>{await this.call('fijar_fecha_oficial',{p_dia:this.navOficial.fecha,p_lugar:this.navOficial.lugar});await this.cargar()})},async sortear(){if(!confirm('¿Realizar el sorteo definitivo?'))return;await this.ejecutar(async()=>{await this.call('realizar_sorteo');await this.cargar();this.mensaje='Sorteo realizado'})},async cambiarPin(){await this.ejecutar(async()=>{await this.call('restablecer_pin',{p_nombre:this.reset.nombre,p_nuevo_pin:this.reset.pin});this.reset.pin='';if(this.reset.nombre===this.sesion.nombre)this.limpiarSesion();this.mensaje='PIN cambiado'})},async limpiar(tipo){if(!this.sesion.admin)return;const nombres={propuestas:'las propuestas de restaurantes',fecha:'la fecha oficial',votos:'los votos y el sorteo',calendario:'las disponibilidades',todo:'TODOS los datos de la cena'};if(!nombres[tipo]||!confirm('¿Borrar '+nombres[tipo]+'? Esta acción es irreversible.'))return;if(tipo==='todo'&&prompt('Escribe BORRAR para confirmar')!=='BORRAR')return;await this.ejecutar(async()=>{await this.call('admin_limpiar_datos',{p_tipo:tipo});this.destinatario='';this.regaloPendiente=false;await this.cargar();this.mensaje='Datos eliminados'})}},mounted(){if(this.sesion)this.ejecutar(()=>this.cargar())}}).mount('#app');
</script></body></html>
